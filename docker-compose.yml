services:
  app:
    build: .
    command: >
      sh -c "alembic upgrade head &&
      python -m src.seeder &&
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://labvida:labvida@postgres:5432/labvida}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8501}
      LGPD_ENCRYPTION_KEY: ${LGPD_ENCRYPTION_KEY:?LGPD_ENCRYPTION_KEY is required}
      SENHA_PADRAO_SEED: ${SENHA_PADRAO_SEED:-labvida123}
      SEED_INICIO: ${SEED_INICIO:-}
      SEED_JANELA_DIAS: ${SEED_JANELA_DIAS:-}
      SEED_ESCALA: ${SEED_ESCALA:-}
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labvida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labvida}
      POSTGRES_DB: ${POSTGRES_DB:-labvida}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app_test:
    build: .
    profiles: ["test"]
    command: sh -c "alembic upgrade head && pytest"
    environment:
      DATABASE_URL: postgresql+psycopg://labvida:labvida@postgres_test:5432/labvida_test
      APP_BASE_URL: http://localhost:8501
      # Chave Fernet de TESTE (32 bytes base64 url-safe), sem uso fora do CI — nao
      # protege dado real nenhum, so precisa ser uma chave Fernet valida para o
      # Fernet aceitar a sessao de testes. Mesmo valor documentado em .env.exemplo
      # e usado como fallback em tests/conftest.py. Sobrescrevivel via
      # LGPD_ENCRYPTION_KEY_TEST se quiser uma chave propria em CI.
      LGPD_ENCRYPTION_KEY: ${LGPD_ENCRYPTION_KEY_TEST:-Q22r1OivohTtSBRaMi-hjLxXxrQ3SwEdOumlaNDfvw8=}
      SENHA_PADRAO_SEED: labvida123
    volumes:
      - .:/app
    depends_on:
      postgres_test:
        condition: service_healthy

  postgres_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: labvida
      POSTGRES_PASSWORD: labvida
      POSTGRES_DB: labvida_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
